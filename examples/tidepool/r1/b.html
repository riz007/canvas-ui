<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidepool — First Light</title>
<link rel="stylesheet" href="b.tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;padding:var(--space-5)}
.top{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:var(--step-n1);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(64px,22vw,92px);line-height:.88;letter-spacing:-.04em;margin:var(--space-6) 0 var(--space-5)}
.t span,.pill{line-height:1.35}
.pill{align-self:flex-start;background:#fff;color:var(--ink);border-radius:999px;padding:var(--space-2) var(--space-4);font-size:var(--step-n1);font-weight:700}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1f9d55;margin-right:var(--space-2)}
.sp{flex:1}
.t{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);margin-top:var(--space-3);text-decoration:none}
.t:active{transform:translateY(2px)}
.t strong{display:block;font-family:var(--font-display);font-weight:700;font-size:var(--step-1)}
.t span{font-size:var(--step-n1);opacity:.8}
.t em{font-style:normal;font-family:var(--font-display);font-weight:800;font-size:var(--step-4);line-height:1}
.t.main{background:#fff;color:var(--ink)}
.inc{text-align:center;font-size:var(--step-n1);font-weight:500;margin:var(--space-4) 0 0}
</style></head><body>
<div class="top"><span>Tidepool</span><span>Ericeira, PT</span></div>
<h1>Small waves. Big start.</h1>
<div class="pill"><i></i>Today 0.8–1.0 m · light offshore · good for beginners</div>
<div class="sp"></div>
<a class="t main" href="#"><div><strong>Group lesson</strong><span>2 h · up to 6 surfers</span></div><em>€45</em></a>
<a class="t" href="#"><div><strong>Private lesson</strong><span>2 h · just you and an instructor</span></div><em>€90</em></a>
<a class="t" href="#"><div><strong>5-day course</strong><span>5 mornings · beginner to improver</span></div><em>€190</em></a>
<p class="inc">Board and wetsuit included</p>
</body></html>
