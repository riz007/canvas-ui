<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drum Clock</title>
<link rel="stylesheet" href="b.tokens.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--weight-body) var(--step-0)/var(--leading-body) var(--font-body); height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: var(--space-5); padding: var(--space-5) var(--space-7) 0; }
.mark { font: 800 var(--step-2)/1 var(--font-display); letter-spacing: -0.02em; }
header .day { font: 400 var(--step-1)/1 var(--font-display); font-style: italic; color: var(--ink-2); }
header nav { margin-left: auto; display: flex; gap: var(--space-2); }
header nav a { text-decoration: none; color: var(--ink); padding: 8px 16px; border-radius: 99px; font-size: var(--step-n1); font-weight: 500; }
header nav a[aria-current] { background: var(--ink); color: var(--bg); }

main { display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 var(--space-7); min-height: 0; }
.dial { position: relative; justify-self: center; width: min(560px, 62vh); aspect-ratio: 1; }
.dial svg { width: 100%; height: 100%; overflow: visible; }
.centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.centre .now { font: 600 var(--step-n1) var(--font-body); color: var(--accent-text); }
.centre .coffee { font: 600 var(--step-4)/1.05 var(--font-display); margin: 6px 0 10px; max-width: 12ch; }
.centre .temp { font: 500 clamp(3.5rem, 2rem + 4vw, 5.5rem)/1 var(--font-mono); letter-spacing: -0.04em; }
.centre .temp small { font-size: 0.4em; color: var(--ink-2); letter-spacing: 0; }
.centre .left { color: var(--ink-2); font-size: var(--step-n1); margin-top: 6px; }

.next { max-width: 460px; }
.next .lbl { font-size: var(--step-n1); color: var(--ink-2); }
.next h2 { font: 600 var(--step-5)/1 var(--font-display); letter-spacing: -0.02em; margin: var(--space-2) 0 var(--space-3); }
.next p { margin: 0; color: var(--ink-2); font-size: var(--step-1); }
.next .facts { display: flex; gap: var(--space-6); margin: var(--space-5) 0; }
.next .facts b { display: block; font: 500 var(--step-3)/1 var(--font-mono); }
.next .facts span { font-size: var(--step-n1); color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 28px; border-radius: 99px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font: 600 var(--step-0) var(--font-body); box-shadow: 0 6px 0 -1px var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; margin-left: var(--space-3); }

footer { display: grid; grid-template-columns: auto repeat(6, 1fr); align-items: end; gap: var(--space-5); padding: var(--space-4) var(--space-7) var(--space-5); background: var(--enamel); border-top: 2px solid var(--ink); }
footer .t { font: 600 var(--step-0)/1.2 var(--font-display); }
footer .t small { display: block; font: 400 var(--step-n1) var(--font-body); color: var(--ink-2); }
.s b { display: block; font: 500 var(--step-3)/1 var(--font-mono); }
.s span { font-size: var(--step-n1); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.s.low b { color: var(--accent-text); }
</style>
</head>
<body>
<header>
  <span class="mark">Rootstock</span><span class="day" id="day"></span>
  <nav><a href="#" aria-current="page">Roast day</a><a href="#">Stock</a><a href="#">Orders</a></nav>
</header>
<main>
  <div class="dial"><svg id="ring" viewBox="-300 -300 600 600" aria-label="Today's roasts on a clock"></svg>
    <div class="centre"><span class="now">Roasting now · 7:30 in</span><span class="coffee" id="cur"></span><span class="temp num">211<small>°C</small></span><span class="left">first crack in about a minute</span></div>
  </div>
  <section class="next" aria-label="Next roast">
    <span class="lbl">Up next at <span class="num">08:45</span></span>
    <h2 id="nx"></h2>
    <p id="nxp"></p>
    <div class="facts"><div><b class="num">15 kg</b><span>charge</span></div><div><b class="num">205°</b><span>charge temp</span></div><div><b class="num">8</b><span>orders waiting</span></div></div>
    <button class="btn">Weigh in green</button><button class="btn ghost">Swap order</button>
  </section>
</main>
<footer id="stock"></footer>
<script src="content.js"></script>
<script>
document.fonts.ready.then(() => {
const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
document.getElementById("day").textContent = RS.day;
const cur = RS.roasts.find((r) => r.status === "roasting"), nx = RS.roasts.find((r) => r.status === "next");
document.getElementById("cur").textContent = cur.coffee;
document.getElementById("nx").textContent = nx.coffee;
document.getElementById("nxp").textContent = `${nx.origin} · ${nx.profile} roast, about ${nx.dur} minutes. Light-to-dark order keeps the drum clean for the espresso batch after it.`;

// Ring: 07:30 → 10:00 mapped to 300° of arc, starting at the top-left.
const t0 = 7.5 * 60, t1 = 10 * 60, a0 = -150, a1 = 150;
const ang = (min) => a0 + ((min - t0) / (t1 - t0)) * (a1 - a0);
const pt = (deg, r) => [Math.sin((deg * Math.PI) / 180) * r, -Math.cos((deg * Math.PI) / 180) * r];
const arc = (d0, d1, r) => { const [x0, y0] = pt(d0, r), [x1, y1] = pt(d1, r); return `M${x0} ${y0} A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
const mins = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
let svg = `<circle r="290" fill="${v("--enamel")}" stroke="${v("--ink")}" stroke-width="3"/><circle r="268" fill="none" stroke="${v("--line")}" stroke-width="1"/>`;
for (let m = t0; m <= t1; m += 15) {
  const big = m % 60 === 0 || m === t0, [x0, y0] = pt(ang(m), 268), [x1, y1] = pt(ang(m), big ? 248 : 258);
  svg += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${v("--ink")}" stroke-width="${big ? 2.5 : 1.25}"/>`;
  if (big) { const [lx, ly] = pt(ang(m), 228); svg += `<text x="${lx}" y="${ly + 5}" text-anchor="middle" font-family="${v("--font-mono")}" font-size="14" fill="${v("--ink-2")}">${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}</text>`; }
}
for (const r of RS.roasts) {
  const s = mins(r.start), d0 = ang(s), d1 = ang(s + r.dur);
  const col = r.status === "done" ? v("--ink-3") : r.status === "roasting" ? v("--accent") : v("--line-strong");
  svg += `<path d="${arc(d0, d1, 190)}" fill="none" stroke="${col}" stroke-width="26" stroke-linecap="round"/>`;
  if (r.status === "roasting") svg += `<path d="${arc(d0, ang(s + r.elapsed), 190)}" fill="none" stroke="${v("--ink")}" stroke-width="8" stroke-linecap="round"/>`;
  const [nxp, nyp] = pt((d0 + d1) / 2, 190);
  svg += `<text x="${nxp}" y="${nyp + 5}" text-anchor="middle" font-family="${v("--font-mono")}" font-size="14" font-weight="500" fill="${r.status === "roasting" ? v("--on-accent") : r.status === "done" ? v("--bg") : v("--ink")}">${r.n}</text>`;
}
const [hx, hy] = pt(ang(mins(cur.start) + cur.elapsed), 282);
svg += `<line x1="0" y1="0" x2="${hx}" y2="${hy}" stroke="${v("--ink")}" stroke-width="2" opacity=".18"/><circle cx="${hx}" cy="${hy}" r="9" fill="${v("--accent")}" stroke="${v("--ink")}" stroke-width="2.5"/>`;
document.getElementById("ring").innerHTML = svg;

const stock = RS.stock.map((s) => ({ ...s, days: Math.round((s.kg / s.perWeek) * 7) })).sort((a, b) => a.days - b.days);
document.getElementById("stock").innerHTML = `<div class="t">Green stock<small>days left at current pace</small></div>` +
  stock.map((s) => `<div class="s${s.days < 10 ? " low" : ""}"><b>${s.days}</b><span>${s.coffee}</span></div>`).join("");
});
</script>
</body>
</html>
