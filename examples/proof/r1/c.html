<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rise Line</title>
<link rel="stylesheet" href="c.tokens.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--weight-body) var(--step-0)/var(--leading-body) var(--font-body); height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr auto; }
header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-4) var(--space-7); border-bottom: 1px solid var(--line); }
.mark { font: 700 var(--step-1)/1 var(--font-display); letter-spacing: -0.02em; }
header nav { display: flex; gap: var(--space-5); font-size: var(--step-n1); }
header nav a { color: var(--ink-2); text-decoration: none; }
.head { display: flex; align-items: end; justify-content: space-between; gap: var(--space-7); padding: var(--space-6) var(--space-7) var(--space-4); }
h1 { font: 600 var(--step-5)/1 var(--font-display); letter-spacing: -0.03em; margin: 0; }
h1 span { color: var(--ink-3); }
.head p { margin: 0; color: var(--ink-2); max-width: 44ch; }
.chart { position: relative; min-height: 0; margin: 0 var(--space-7); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.foot { display: grid; grid-template-columns: repeat(4, auto) 1fr auto; align-items: center; gap: var(--space-7); padding: var(--space-5) var(--space-7); }
.foot dl { margin: 0; } .foot dt { font-size: var(--step-n1); color: var(--ink-2); } .foot dd { margin: 0; font: 500 var(--step-1) var(--font-mono); }
.foot .price { text-align: right; font-size: var(--step-n1); color: var(--ink-2); }
.cta { height: 52px; padding: 0 26px; border-radius: var(--radius); border: 0; background: var(--ink); color: var(--bg); font: 600 var(--step-0) var(--font-body); }
</style>
</head>
<body>
<header><span class="mark">Proof</span><nav><a href="#">The curve</a><a href="#">The lid</a><a href="#">FAQ</a></nav></header>
<div class="head"><h1>This is your starter. <span>You've never seen it.</span></h1><p id="sub"></p></div>
<div class="chart"><canvas id="c" aria-label="Starter rise over 14 hours after a 9:40 feed, peaking at 16:38"></canvas></div>
<div class="foot" id="foot"></div>
<script src="content.js"></script>
<script>
document.fonts.ready.then(() => {
const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
document.getElementById("sub").textContent = "A real rye starter, fed at 9:40 and measured every five minutes by the Proof lid. The peak is the moment to bake. Proof tells your phone when it arrives.";
document.getElementById("foot").innerHTML = PF.specs.map(([k, val]) => `<dl><dt>${k}</dt><dd>${val}</dd></dl>`).join("") + `<span class="price">${PF.price} · ships ${PF.ships}</span><button class="cta">${PF.cta}</button>`;
const cv = document.getElementById("c"), r = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
cv.width = W * r; cv.height = H * r;
const x = cv.getContext("2d"); x.scale(r, r);
const pad = { l: 56, r: 24, t: 64, b: 34 };
const X = (h) => pad.l + (h / 14) * (W - pad.l - pad.r), Y = (p) => H - pad.b - (p / 140) * (H - pad.t - pad.b);
x.font = `12px ${v("--font-mono")}`; x.fillStyle = v("--ink-2");
for (const p of [0, 50, 100]) { x.strokeStyle = v("--line"); x.beginPath(); x.moveTo(pad.l, Y(p)); x.lineTo(W - pad.r, Y(p)); x.stroke(); x.fillText(`+${p}%`, 4, Y(p) + 4); }
const times = ["09:40", "11:40", "13:40", "15:40", "17:40", "19:40", "21:40", "23:40"];
times.forEach((t, i) => x.fillText(t, X(i * 2) - 18, H - 10));
const pts = PF.rise(169);
// readings as dots (one per 5 min), then the smooth line
x.fillStyle = v("--ink-3");
pts.forEach(([h, p], i) => { if (i % 2) return; x.beginPath(); x.arc(X(h), Y(p + Math.sin(i * 1.7) * 1.6), 1.6, 0, 7); x.fill(); });
x.strokeStyle = v("--ink"); x.lineWidth = 2.5; x.beginPath(); pts.forEach(([h, p], i) => (i ? x.lineTo(X(h), Y(p)) : x.moveTo(X(h), Y(p)))); x.stroke();
const peak = pts.reduce((a, b) => (b[1] > a[1] ? b : a));
x.strokeStyle = v("--accent"); x.lineWidth = 1.5; x.setLineDash([4, 4]); x.beginPath(); x.moveTo(X(peak[0]), Y(peak[1])); x.lineTo(X(peak[0]), H - pad.b); x.stroke(); x.setLineDash([]);
x.fillStyle = v("--accent"); x.beginPath(); x.arc(X(peak[0]), Y(peak[1]), 7, 0, 7); x.fill();
x.fillStyle = v("--accent-text"); x.font = `600 15px ${v("--font-body")}`;
x.fillText("Peak · 16:38 · +118%", X(peak[0]) + 14, Y(peak[1]) - 34);
x.font = `13px ${v("--font-body")}`; x.fillStyle = v("--ink-2");
x.fillText("Proof pings your phone here.", X(peak[0]) + 14, Y(peak[1]) - 16);
x.fillText("Fed 9:40, 24 °C", X(0.15), Y(4) - 10);
x.fillText("Collapsing: past its best", X(10.6), Y(55) - 12);
});
</script>
</body>
</html>
