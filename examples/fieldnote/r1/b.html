<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Exterior</title>
<link rel="stylesheet" href="b.tokens.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--weight-body) var(--step-0)/var(--leading-body) var(--font-body); height: 100vh; overflow: hidden; position: relative; }

#spec { position: absolute; inset: 0 0 auto 0; width: 100%; height: 74vh; display: block; }
.fade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, var(--bg) 74%); pointer-events: none; }

header { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: baseline; justify-content: space-between; padding: var(--space-5) var(--space-7); z-index: 2; }
.mark { font: italic 400 var(--step-3)/1 var(--font-display); }
nav { display: flex; gap: var(--space-6); font-size: var(--step-n1); }
nav a { color: var(--ink); text-decoration: none; opacity: .82; }
nav a:last-child { opacity: 1; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

.freq { position: absolute; top: 96px; right: var(--space-7); z-index: 2; display: grid; gap: 74px; font: var(--step-n2) var(--font-mono); color: var(--ink-2); text-align: right; }

.title { position: absolute; left: var(--space-7); bottom: 132px; z-index: 2; max-width: 980px; }
h1 { font: 400 clamp(4.5rem, 3rem + 5vw, 9rem)/0.88 var(--font-display); letter-spacing: -0.02em; margin: 0; }
h1 em { color: var(--accent); }
.lede { font-size: var(--step-1); color: var(--ink-2); max-width: 34ch; margin: var(--space-5) 0 0; line-height: 1.4; }
.actions { position: absolute; right: var(--space-7); bottom: 140px; z-index: 2; display: flex; align-items: center; gap: var(--space-5); }
.play { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); border: 0; display: grid; place-items: center; box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 16%, transparent); }
.play svg { width: 26px; height: 26px; fill: var(--on-accent); margin-left: 5px; }
.actions .lbl { font-size: var(--step-n1); color: var(--ink-2); line-height: 1.35; }
.actions .lbl b { display: block; color: var(--ink); font-weight: 600; font-size: var(--step-0); }
.browse { color: var(--ink); text-underline-offset: 5px; text-decoration-thickness: 1px; margin-left: var(--space-5); }

.slate { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; grid-template-columns: repeat(6, auto); justify-content: space-between; gap: var(--space-5); padding: var(--space-4) var(--space-7); border-top: 1px solid var(--line); font: var(--step-n1) var(--font-mono); color: var(--ink-2); }
.slate span b { display: block; font: 400 var(--step-n2) var(--font-mono); color: var(--ink-3); margin-bottom: 2px; }
.slate span { color: var(--ink); }
</style>
</head>
<body>
<canvas id="spec" aria-hidden="true"></canvas>
<div class="fade"></div>
<header><div class="mark">Fieldnote</div><nav><a href="#">Library</a><a href="#">Places</a><a href="#">Pricing</a><a href="#">Sign in</a></nav></header>
<div class="freq" aria-hidden="true"><span>16 kHz</span><span>4 kHz</span><span>1 kHz</span><span>250 Hz</span></div>
<div class="title">
  <h1>Rain on cedar,<br><em>4:12</em> a.m.</h1>
  <p class="lede" id="lede"></p>
</div>
<div class="actions">
  <button class="play" aria-label="Play recording"><svg viewBox="0 0 10 10"><path d="M0 0l10 5-10 5z"/></svg></button>
  <span class="lbl"><b>Play 6:48</b>Headphones on</span>
  <a class="browse" href="#">Browse 41,280 recordings →</a>
</div>
<div class="slate" id="slate"></div>
<script src="content.js"></script>
<script>
const c = FN.clips[0];
document.getElementById("lede").textContent = FN.pitch;
document.getElementById("slate").innerHTML = [
  ["Place", `${c.place}, ${c.region}`], ["Position", "47.86° N 123.93° W"], ["Hour", `${c.time} local`],
  ["Weather", c.weather], ["Mic", c.mic], ["Format", `${FN.stats.format} · ${c.id}`],
].map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join("");

// Procedural spectrogram: rain is broadband with dense high-frequency speckle; drips are short vertical streaks.
const cv = document.getElementById("spec"), css = getComputedStyle(document.documentElement);
const hex = (n) => css.getPropertyValue(n).trim();
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const [BG, INK, HOT] = [rgb(hex("--bg")), rgb(hex("--ink")), rgb(hex("--accent"))];
const W = cv.width = Math.floor(cv.clientWidth / 2), H = cv.height = Math.floor(cv.clientHeight / 2);
const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);
let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
const drips = Array.from({ length: 55 }, () => [rnd() * W, 0.15 + rnd() * 0.6, 0.4 + rnd() * 0.6]);
for (let x = 0; x < W; x++) {
  const swell = 0.55 + 0.25 * Math.sin(x / W * 5.2) + 0.12 * Math.sin(x / 37);
  for (let y = 0; y < H; y++) {
    const f = 1 - y / H; // 0 = low freq (bottom), 1 = high
    let e = (0.35 + 0.65 * Math.exp(-((f - 0.62) ** 2) / 0.05)) * swell * (0.45 + rnd() * 0.75);
    e += 0.55 * Math.exp(-((f - 0.08) ** 2) / 0.004) * (0.6 + 0.4 * Math.sin(x / 11)); // low rumble band
    for (const [dx, df, amp] of drips) if (Math.abs(x - dx) < 1.6 && f > df - 0.25 && f < df + 0.2) e += amp * 0.42;
    e = Math.min(1, Math.max(0, e - 0.18));
    const t1 = Math.min(1, e * 1.6), t2 = Math.max(0, e - 0.72) / 0.28;
    const col = [0, 1, 2].map((k) => BG[k] + (INK[k] - BG[k]) * t1 * 0.62 + (HOT[k] - (BG[k] + (INK[k] - BG[k]) * t1 * 0.62)) * t2);
    const i = (y * W + x) * 4;
    img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
  }
}
ctx.putImageData(img, 0, 0);
</script>
</body>
</html>
