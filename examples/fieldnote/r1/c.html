<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey</title>
<link rel="stylesheet" href="c.tokens.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--weight-body) var(--step-0)/var(--leading-body) var(--font-body); height: 100vh; overflow: hidden; display: grid; grid-template-columns: 380px minmax(0, 1fr); }

aside { border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; min-height: 0; background: var(--bg); z-index: 2; }
.top { padding: var(--space-5) var(--space-5) var(--space-4); }
.mark { font: 700 var(--step-2)/1 var(--font-display); letter-spacing: -0.03em; display: flex; align-items: center; gap: 10px; }
.mark svg { width: 26px; height: 26px; }
.search { margin-top: var(--space-5); display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 var(--space-4); border: 1.5px solid var(--ink); border-radius: var(--radius); background: #fff; }
.search input { border: 0; outline: 0; flex: 1; font: inherit; color: var(--ink); background: none; }
.tabs { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
.tabs button { font: 700 var(--step-n1) var(--font-body); padding: 6px 12px; border-radius: var(--radius); border: 1.5px solid var(--ink); background: none; color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.index { overflow: hidden; flex: 1; border-top: 1.5px solid var(--ink); }
.region { padding: var(--space-3) var(--space-5) var(--space-1); font: var(--step-n1) var(--font-mono); color: var(--ink-2); }
.place { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 9px var(--space-5); border-bottom: 1px solid var(--line); }
.place b { font: 500 var(--step-1)/1.2 var(--font-display); letter-spacing: -0.01em; }
.place span { font: var(--step-n1) var(--font-mono); color: var(--ink-2); }
.place.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.place.sel span { color: var(--on-accent); }

main { position: relative; overflow: hidden; background: var(--bg); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; }
.grid-ref { position: absolute; font: var(--step-n2) var(--font-mono); color: var(--ink-2); }
.pin { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); box-shadow: 0 0 0 1.5px var(--accent); display: grid; place-items: center; color: var(--on-accent); font: 700 var(--step-n2)/1 var(--font-mono); }
.pin.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 10px color-mix(in srgb, var(--accent) 18%, transparent); }
.label { position: absolute; transform: translate(12px, -50%); font: 700 var(--step-n1)/1 var(--font-display); color: var(--ink); white-space: nowrap; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 3px var(--bg); }

.sheet { position: absolute; left: 38%; bottom: var(--space-6); width: 420px; background: #fff; border: 1.5px solid var(--ink); border-radius: var(--radius-lg); box-shadow: 6px 6px 0 var(--ink); }
.sheet header { padding: var(--space-4) var(--space-5); border-bottom: 1.5px solid var(--ink); display: flex; justify-content: space-between; align-items: start; gap: var(--space-3); }
.sheet h2 { font: 700 var(--step-3)/1 var(--font-display); letter-spacing: -0.03em; margin: 0; }
.sheet .coord { font: var(--step-n1) var(--font-mono); color: var(--ink-2); margin-top: 6px; white-space: nowrap; }
.sheet .n { white-space: nowrap; font: var(--step-n1) var(--font-mono); background: var(--accent-soft); color: var(--ink); padding: 4px 8px; border-radius: var(--radius-sm); }
.clip { display: grid; grid-template-columns: 36px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); }
.clip:last-of-type { border-bottom: 0; }
.clip .pl { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; }
.clip .pl svg { width: 11px; height: 11px; fill: var(--ink); margin-left: 2px; }
.clip.on .pl { background: var(--accent); border-color: var(--accent); }
.clip.on .pl svg { fill: var(--on-accent); }
.clip .t { font-weight: 700; line-height: 1.25; }
.clip canvas { display: block; width: 100%; height: 18px; margin-top: 4px; }
.clip .len { font: var(--step-n1) var(--font-mono); color: var(--ink-2); }
.sheet footer { padding: var(--space-3) var(--space-5) var(--space-4); }
.sheet footer a { color: var(--accent-text); font-weight: 700; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.scale { position: absolute; right: var(--space-6); bottom: var(--space-5); font: var(--step-n2) var(--font-mono); color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.scale i { display: block; width: 120px; height: 6px; border: 1.5px solid var(--ink); border-top: 0; }
</style>
</head>
<body>
<aside>
  <div class="top">
    <div class="mark"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18c4-6 7 2 10-4s6-4 10-8"/><path d="M3 23c5-5 8 1 11-3s6-3 9-6" opacity=".5"/><circle cx="17" cy="9" r="2.6" fill="var(--accent)" stroke="none"/></svg>Fieldnote</div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input aria-label="Search places or sounds" placeholder="A place, or a sound…"></label>
    <div class="tabs"><button aria-pressed="true">Places</button><button aria-pressed="false">Sounds</button><button aria-pressed="false">Hours</button></div>
  </div>
  <div class="index" id="index"></div>
</aside>
<main>
  <canvas id="map" aria-hidden="true"></canvas>
  <div id="pins"></div>
  <section class="sheet" aria-label="Selected place">
    <header><div><h2>Pacific Northwest</h2><div class="coord">47.6° N 122.3° W · 211 wet days/yr</div></div><span class="n">1,840 rec.</span></header>
    <div id="clips"></div>
    <footer><a href="#">All 1,840 from this region →</a></footer>
  </section>
  <div class="scale"><i></i>1,000 km · equirectangular</div>
</main>
<script src="content.js"></script>
<script>
document.fonts.ready.then(() => {
const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim(), r = devicePixelRatio || 1;

// Index: places grouped by hemisphere band.
const bands = [["North", (p) => p.lat > 40], ["Tropics & mid-latitudes", (p) => p.lat <= 40 && p.lat > -15], ["South", (p) => p.lat <= -15]];
document.getElementById("index").innerHTML = bands.map(([name, f]) =>
  `<div class="region">${name}</div>` + FN.places.filter(f).sort((a, b) => b.count - a.count).map((p) =>
    `<div class="place${p.name === "Pacific Northwest" ? " sel" : ""}"><b>${p.name}</b><span>${p.count.toLocaleString("en")}</span></div>`).join("")).join("");

// Sheet clips with mini waveforms
const picks = [FN.clips[0], { ...FN.clips[3], name: "Creek under alder, snowmelt", len: "5:10", seed: 51 }, { ...FN.clips[5], name: "Ferry horn across Puget Sound", len: "0:48", seed: 57 }];
document.getElementById("clips").innerHTML = picks.map((c, i) => `<div class="clip${i === 0 ? " on" : ""}"><span class="pl"><svg viewBox="0 0 10 10"><path d="M0 0l10 5-10 5z"/></svg></span><div><div class="t">${c.name}</div><canvas data-seed="${c.seed}"></canvas></div><span class="len">${c.len}</span></div>`).join("");
document.querySelectorAll(".clip canvas").forEach((cv, k) => {
  const w = cv.clientWidth, h = cv.clientHeight; cv.width = w * r; cv.height = h * r;
  const g = cv.getContext("2d"); g.scale(r, r);
  FN.wave(+cv.dataset.seed, Math.floor(w / 3)).forEach((p, i, arr) => { g.fillStyle = k === 0 && i / arr.length < 0.4 ? v("--accent") : v("--ink-3"); const bh = Math.max(2, p * h); g.fillRect(i * 3, (h - bh) / 2, 2, bh); });
});

// Map: procedural terrain contours (value noise + marching squares), graticule, pins.
const main = document.querySelector("main"), cv = document.getElementById("map");
const W = main.clientWidth, H = main.clientHeight;
cv.width = W * r; cv.height = H * r;
const x = cv.getContext("2d"); x.scale(r, r);
const proj = (lat, lon) => [((lon + 170) / 340) * W, ((72 - lat) / 130) * H];

let seed = 5; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const G = 48, grid = Array.from({ length: G + 1 }, () => Array.from({ length: G + 1 }, rnd));
const smooth = (t) => t * t * (3 - 2 * t);
const noise = (u, w) => { const i = Math.floor(u), j = Math.floor(w), fu = smooth(u - i), fw = smooth(w - j), g = (a, b) => grid[(a % G + G) % G][(b % G + G) % G];
  return g(i, j) * (1 - fu) * (1 - fw) + g(i + 1, j) * fu * (1 - fw) + g(i, j + 1) * (1 - fu) * fw + g(i + 1, j + 1) * fu * fw; };
const height = (px, py) => { const u = px / W * 6, w = py / H * 4; return noise(u, w) * 0.6 + noise(u * 2.1, w * 2.1) * 0.3 + noise(u * 4.3, w * 4.3) * 0.1; };

const step = 6, cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / step) + 1;
const hm = []; for (let j = 0; j < rows; j++) { hm.push([]); for (let i = 0; i < cols; i++) hm[j].push(height(i * step, j * step)); }
// water below 0.38
// Water: low-res mask scaled up with smoothing; the 0.38 contour drawn below gives the crisp coastline.
const wm = document.createElement("canvas"); wm.width = cols; wm.height = rows;
const wx = wm.getContext("2d"), wd = wx.createImageData(cols, rows), [wr, wg, wb] = [1, 3, 5].map((k) => parseInt(v("--water").slice(k, k + 2), 16));
for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const o = (j * cols + i) * 4; wd.data[o] = wr; wd.data[o + 1] = wg; wd.data[o + 2] = wb; wd.data[o + 3] = Math.max(0, Math.min(255, (0.385 - hm[j][i]) * 255 * 40)); }
wx.putImageData(wd, 0, 0);
x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high"; x.drawImage(wm, 0, 0, cols * step, rows * step);
for (let k = 0; k < 14; k++) {
  const lvl = 0.38 + k * 0.035;
  x.strokeStyle = k % 5 === 0 ? v("--ink-3") : v("--contour"); x.lineWidth = k % 5 === 0 ? 1.1 : 0.8;
  x.beginPath();
  for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
    const a = hm[j][i], b = hm[j][i + 1], c = hm[j + 1][i + 1], d = hm[j + 1][i];
    const pts = [];
    const e = (p, q, x0, y0, x1, y1) => { if ((p < lvl) !== (q < lvl)) { const t = (lvl - p) / (q - p); pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]); } };
    const X = i * step, Y = j * step;
    e(a, b, X, Y, X + step, Y); e(b, c, X + step, Y, X + step, Y + step); e(d, c, X, Y + step, X + step, Y + step); e(a, d, X, Y, X, Y + step);
    if (pts.length >= 2) { x.moveTo(...pts[0]); x.lineTo(...pts[1]); }
    if (pts.length === 4) { x.moveTo(...pts[2]); x.lineTo(...pts[3]); }
  }
  x.stroke();
}
// graticule
x.strokeStyle = v("--ink"); x.globalAlpha = 0.12; x.lineWidth = 1; x.setLineDash([2, 4]);
for (let lon = -150; lon <= 160; lon += 30) { const [px] = proj(0, lon); x.beginPath(); x.moveTo(px, 0); x.lineTo(px, H); x.stroke(); }
for (let lat = -45; lat <= 60; lat += 15) { const [, py] = proj(lat, 0); x.beginPath(); x.moveTo(0, py); x.lineTo(W, py); x.stroke(); }
x.setLineDash([]); x.globalAlpha = 1;

const pins = document.getElementById("pins");
for (const lat of [60, 30, 0, -30]) { const [, py] = proj(lat, 0); pins.insertAdjacentHTML("beforeend", `<span class="grid-ref" style="left:12px;top:${py - 16}px">${Math.abs(lat)}°${lat >= 0 ? "N" : "S"}</span>`); }
// Pins largest first; labels skip when they would collide with another label or the sheet, and flip left near the edge.
const sheet = document.querySelector(".sheet").getBoundingClientRect(), mainBox = main.getBoundingClientRect();
const avoid = [{ l: sheet.left - mainBox.left - 8, t: sheet.top - mainBox.top - 8, r: sheet.right - mainBox.left + 8, b: sheet.bottom - mainBox.top + 8 }];
const hit = (a) => avoid.some((b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t);
let selPin;
for (const p of [...FN.places].sort((a, b) => b.count - a.count)) {
  const [px, py] = proj(p.lat, p.lon), size = 14 + Math.sqrt(p.count) * 0.42, sel = p.name === "Pacific Northwest";
  if (hit({ l: px - size / 2, t: py - size / 2, r: px + size / 2, b: py + size / 2 })) continue;
  pins.insertAdjacentHTML("beforeend", `<span class="pin${sel ? " sel" : ""}" style="left:${px}px;top:${py}px;width:${size}px;height:${size}px">${size > 30 ? Math.round(p.count / 100) / 10 + "k" : ""}</span>`);
  avoid.push({ l: px - size / 2, t: py - size / 2, r: px + size / 2, b: py + size / 2 });
  if (sel) selPin = [px, py, size];
  const lbl = document.createElement("span"); lbl.className = "label"; lbl.textContent = p.name; pins.appendChild(lbl);
  const lw = lbl.offsetWidth, flip = px + size / 2 + 12 + lw > W - 16;
  const box = { l: flip ? px - size / 2 - 12 - lw : px + size / 2 + 12, t: py - 9, r: flip ? px - size / 2 - 12 : px + size / 2 + 12 + lw, b: py + 9 };
  if (hit(box)) { lbl.remove(); continue; }
  lbl.style.left = box.l + "px"; lbl.style.top = py + "px"; lbl.style.transform = "translateY(-50%)";
  avoid.push(box);
}
// Magenta leader line from the selected pin to its sheet, like a survey callout.
if (selPin) {
  x.strokeStyle = v("--accent"); x.lineWidth = 1.5; x.setLineDash([5, 4]);
  x.beginPath(); x.moveTo(selPin[0] + selPin[2] / 2, selPin[1]); x.lineTo(sheet.left - mainBox.left + 40, selPin[1]); x.lineTo(sheet.left - mainBox.left + 40, sheet.top - mainBox.top); x.stroke(); x.setLineDash([]);
}

});
</script>
</body>
</html>
