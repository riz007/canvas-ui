name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NODE_OPTIONS: ${{ matrix.node == 20 && '--experimental-websocket' || '' }}
      - name: Installer dry run
        run: ./install.sh all --dry-run
